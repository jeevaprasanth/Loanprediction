<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Analytics Dashboard - Loan Default Prediction System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>
    <div class="container-fluid">
        <!-- Header -->
        <header class="bg-primary text-white py-4 mb-4">
            <div class="container">
                <div class="row align-items-center">
                    <div class="col-md-8">
                        <h1 class="mb-0">
                            <i class="fas fa-chart-line me-3"></i>
                            Analytics Dashboard
                        </h1>
                        <p class="mb-0 mt-2">Advanced loan risk analytics and insights</p>
                    </div>
                    <div class="col-md-4 text-md-end">
                        <a href="/" class="btn btn-light me-2">
                            <i class="fas fa-home me-2"></i>Back to Home
                        </a>
                        <button class="btn btn-success" onclick="refreshDashboard()">
                            <i class="fas fa-sync-alt me-2"></i>Refresh
                        </button>
                    </div>
                </div>
            </div>
        </header>

        <div class="container">
            <!-- Key Metrics -->
            <div class="row mb-4">
                <div class="col-md-3">
                    <div class="card bg-primary text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h4 class="mb-0" id="totalPredictions">0</h4>
                                    <small>Total Predictions</small>
                                </div>
                                <i class="fas fa-chart-bar fa-2x opacity-75"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-success text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h4 class="mb-0" id="lowRiskCount">0</h4>
                                    <small>Low Risk</small>
                                </div>
                                <i class="fas fa-shield-alt fa-2x opacity-75"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-warning text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h4 class="mb-0" id="mediumRiskCount">0</h4>
                                    <small>Medium Risk</small>
                                </div>
                                <i class="fas fa-exclamation-triangle fa-2x opacity-75"></i>
                            </div>
                        </div>
                    </div>
                </div>
                <div class="col-md-3">
                    <div class="card bg-danger text-white">
                        <div class="card-body">
                            <div class="d-flex justify-content-between">
                                <div>
                                    <h4 class="mb-0" id="highRiskCount">0</h4>
                                    <small>High Risk</small>
                                </div>
                                <i class="fas fa-times-circle fa-2x opacity-75"></i>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Charts Row -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-chart-pie me-2"></i>
                                Risk Distribution
                            </h5>
                        </div>
                        <div class="card-body">
                            <canvas id="riskDistributionChart"></canvas>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-chart-line me-2"></i>
                                Recent Trends
                            </h5>
                        </div>
                        <div class="card-body">
                            <canvas id="trendsChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Feature Importance -->
            <div class="row mb-4">
                <div class="col-md-12">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-brain me-2"></i>
                                Feature Importance
                            </h5>
                        </div>
                        <div class="card-body">
                            <canvas id="featureImportanceChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Advanced Features -->
            <div class="row mb-4">
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-magic me-2"></i>
                                What-If Analysis
                            </h5>
                        </div>
                        <div class="card-body">
                            <form id="whatIfForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Base Credit Score</label>
                                        <input type="number" class="form-control" id="baseCreditScore" value="680" min="300" max="850">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">New Credit Score</label>
                                        <input type="number" class="form-control" id="newCreditScore" value="750" min="300" max="850">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Base Income (₹)</label>
                                        <input type="number" class="form-control" id="baseIncome" value="600000" min="200000" max="3000000">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">New Income (₹)</label>
                                        <input type="number" class="form-control" id="newIncome" value="800000" min="200000" max="3000000">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-primary">
                                    <i class="fas fa-play me-2"></i>Analyze Impact
                                </button>
                            </form>
                            <div id="whatIfResults" class="mt-3"></div>
                        </div>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="card">
                        <div class="card-header">
                            <h5 class="mb-0">
                                <i class="fas fa-lightbulb me-2"></i>
                                Loan Recommendations
                            </h5>
                        </div>
                        <div class="card-body">
                            <form id="recommendationsForm">
                                <div class="row">
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Income (₹)</label>
                                        <input type="number" class="form-control" id="recIncome" value="600000" min="200000" max="3000000">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Credit Score</label>
                                        <input type="number" class="form-control" id="recCreditScore" value="680" min="300" max="850">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Debt-to-Income Ratio</label>
                                        <input type="number" class="form-control" id="recDebtRatio" value="0.25" min="0" max="0.6" step="0.01">
                                    </div>
                                    <div class="col-md-6 mb-3">
                                        <label class="form-label">Max Loan Amount (₹)</label>
                                        <input type="number" class="form-control" id="maxLoan" value="10000000" min="100000" max="10000000">
                                    </div>
                                </div>
                                <button type="submit" class="btn btn-success">
                                    <i class="fas fa-calculator me-2"></i>Get Recommendations
                                </button>
                            </form>
                            <div id="recommendationsResults" class="mt-3"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@3.9.1/dist/chart.min.js"></script>
    <script src="{{ url_for('static', filename='js/analytics.js') }}"></script>
</body>
</html>
